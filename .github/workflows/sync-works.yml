# 정산 사이트에서 등록한 출간작을 홈페이지(index.html · llms.txt · sitemap.xml · assets/img)에 반영합니다.
# 실행 시점: ① 수동(Actions 탭 → Run workflow)  ② 정산 사이트에서 저장 시 자동 호출(다음 단계)  ③ 매일 한 번 안전망
name: sync-works

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국 시간 06:17

permissions:
  contents: write

concurrency:               # 연달아 저장해도 한 번에 하나씩, 대기 중인 요청은 가장 최신 하나로 합쳐짐
  group: sync-works
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 출간작 반영
        env:
          SUPABASE_URL: https://wddixxdrndgvjgicwunu.supabase.co
          WORKS_FEED_TOKEN: ${{ secrets.WORKS_FEED_TOKEN }}
        run: node scripts/build-works.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain index.html llms.txt sitemap.xml assets/img)" ]; then
            git config user.name "yahwalab-bot"
            git config user.email "yahwalab-bot@users.noreply.github.com"
            git add index.html llms.txt sitemap.xml assets/img
            git commit -m "출간작 자동 반영"
            git push
          else
            echo "변경 없음"
          fi
